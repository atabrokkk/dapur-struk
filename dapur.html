<!DOCTYPE html>
<html lang="id">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Layar Dapur & Kasir - Omah Kopi</title>

    <link rel="preconnect"
          href="https://fonts.googleapis.com">

    <link rel="preconnect"
          href="https://fonts.gstatic.com"
          crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&family=Playfair+Display:wght@600&display=swap"
          rel="stylesheet">

    <style>

        :root {
            --bg-color: #fcf8f3;
            --primary-color: #4a2c2a;
            --accent-color: #8c5a3c;
            --light-accent: #e8d8c8;
            --text-dark: #2d2424;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background: var(--bg-color);
            color: var(--text-dark);
            padding: 20px;
        }

        .header-dapur {
            background: var(--primary-color);
            color: white;
            padding: 20px;
            border-radius: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }

        .header-dapur h1 {
            font-family: 'Playfair Display', serif;
            font-size: 22px;
            color: #f3e5d8;
        }

        .header-dapur p {
            font-size: 12px;
            margin-top: 4px;
        }

        .clear-btn {
            background: #d9534f;
            color: white;
            border: none;
            padding: 9px 14px;
            border-radius: 8px;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
        }

        .grid-antrean {
            display: grid;
            grid-template-columns: repeat(
                auto-fill,
                minmax(280px, 1fr)
            );
            gap: 20px;
        }

        .order-card {
            background: white;
            border-radius: 16px;
            border: 2px solid var(--light-accent);
            box-shadow: 0 8px 20px rgba(74,44,42,0.08);
            overflow: hidden;
        }

        .card-header {
            background: var(--primary-color);
            color: white;
            padding: 13px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .meja-title {
            font-size: 17px;
            font-weight: 700;
            color: #f3e5d8;
        }

        .jam {
            font-size: 11px;
            color: var(--light-accent);
        }

        .card-body {
            padding: 16px;
        }

        .item-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            font-size: 13px;
            margin-bottom: 8px;
            padding-bottom: 8px;
            border-bottom: 1px dashed #ddd;
        }

        .item-left {
            display: flex;
            align-items: center;
            gap: 7px;
        }

        .qty-badge {
            background: var(--primary-color);
            color: white;
            padding: 3px 7px;
            border-radius: 6px;
            font-weight: 700;
            font-size: 12px;
        }

        .item-name {
            font-weight: 600;
            color: var(--primary-color);
        }

        .card-total {
            margin-top: 15px;
            padding-top: 10px;
            border-top: 2px dashed var(--light-accent);
            display: flex;
            justify-content: space-between;
            font-weight: 700;
            color: var(--accent-color);
        }

        .card-actions {
            padding: 12px 16px;
            background: #fdfaf7;
            border-top: 1px solid var(--light-accent);
        }

        .btn-print {
            width: 100%;
            background: var(--primary-color);
            color: white;
            border: none;
            padding: 11px;
            border-radius: 8px;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
        }

        .empty {
            grid-column: 1 / -1;
            text-align: center;
            color: var(--accent-color);
            margin-top: 60px;
        }

        #receipt-print-area {
            display: none;
        }

        @media print {

            body * {
                visibility: hidden;
            }

            #receipt-print-area,
            #receipt-print-area * {
                visibility: visible;
            }

            #receipt-print-area {
                display: block;
                position: absolute;
                left: 0;
                top: 0;
                width: 80mm;
                padding: 10px;
                background: white;
                color: black;
                font-family: 'Courier New', monospace;
            }

            .receipt-header {
                text-align: center;
                border-bottom: 1px dashed black;
                padding-bottom: 10px;
                margin-bottom: 10px;
            }

            .receipt-item {
                display: flex;
                justify-content: space-between;
                font-size: 11px;
                margin-bottom: 5px;
            }

            .receipt-total {
                display: flex;
                justify-content: space-between;
                border-top: 1px dashed black;
                margin-top: 10px;
                padding-top: 6px;
                font-weight: bold;
            }

            .receipt-footer {
                text-align: center;
                border-top: 1px dashed black;
                margin-top: 15px;
                padding-top: 6px;
                font-size: 10px;
            }
        }

        @media (max-width: 600px) {

            .header-dapur {
                flex-direction: column;
                align-items: stretch;
                gap: 15px;
            }

            .clear-btn {
                width: 100%;
            }
        }

    </style>

</head>

<body>

    <div class="header-dapur">

        <div>

            <h1>
                👨‍🍳 Layar Monitor Dapur & Kasir
            </h1>

            <p>
                Antrean Pesanan Masuk Real-Time
            </p>

        </div>

        <button
            class="clear-btn"
            onclick="clearAllOrders()"
        >
            Reset Semua Pesanan
        </button>

    </div>


    <div
        class="grid-antrean"
        id="antrean-container"
    >

        <h3 class="empty">
            Memuat pesanan...
        </h3>

    </div>


    <div id="receipt-print-area"></div>


<script>

    // ==========================================
    // SUPABASE
    // ==========================================

    const SUPABASE_URL =
        "https://ebfzxtdumtllztgnijww.supabase.co";

    const SUPABASE_KEY =
        "sb_publishable_YVUp6Jqo66JTGVOMgD_r7w_9NAF4AZO";


    let listPesanan = [];


    // ==========================================
    // AMBIL PESANAN
    // ==========================================

    async function loadOrders() {

        try {

            const response = await fetch(
                `${SUPABASE_URL}/rest/v1/order?select=*`,
                {
                    method: "GET",

                    headers: {
                        "apikey": SUPABASE_KEY,
                        "Authorization":
                            `Bearer ${SUPABASE_KEY}`
                    }
                }
            );


            if (!response.ok) {

                const error =
                    await response.text();

                console.error(
                    "SUPABASE ERROR:",
                    error
                );

                document.getElementById(
                    "antrean-container"
                ).innerHTML = `
                    <h3 class="empty">
                        Gagal mengambil pesanan.
                    </h3>
                `;

                return;

            }


            listPesanan =
                await response.json();


            // Urutkan dari pesanan lama ke baru

            listPesanan.sort(
                (a, b) =>
                    Number(a.id) -
                    Number(b.id)
            );


            renderAntrean();


        } catch (error) {

            console.error(error);

            document.getElementById(
                "antrean-container"
            ).innerHTML = `
                <h3 class="empty">
                    Tidak bisa terhubung ke database.
                </h3>
            `;

        }

    }


    // ==========================================
    // TAMPILKAN PESANAN
    // ==========================================

    function renderAntrean() {

        const container =
            document.getElementById(
                "antrean-container"
            );


        container.innerHTML = "";


        if (listPesanan.length === 0) {

            container.innerHTML = `
                <h3 class="empty">
                    Belum Ada Pesanan Masuk...
                </h3>
            `;

            return;

        }


        listPesanan.forEach(order => {

            let itemsHTML = "";
            let grandTotal = 0;


            order.items.forEach(item => {

                const subtotal =
                    Number(item.price) *
                    Number(item.qty);


                grandTotal += subtotal;


                itemsHTML += `
                    <div class="item-row">

                        <div class="item-left">

                            <span class="qty-badge">
                                ${item.qty}x
                            </span>

                            <span class="item-name">
                                ${item.name}
                            </span>

                        </div>

                        <div>
                            Rp ${subtotal.toLocaleString("id-ID")}
                        </div>

                    </div>
                `;

            });


            container.innerHTML += `
                <div class="order-card">

                    <div class="card-header">

                        <span class="meja-title">
                            📍 ${order.meja}
                        </span>

                        <span class="jam">
                            ${order.jam}
                        </span>

                    </div>


                    <div class="card-body">

                        ${itemsHTML}


                        <div class="card-total">

                            <span>
                                Total Tagihan
                            </span>

                            <span>
                                Rp ${grandTotal.toLocaleString("id-ID")}
                            </span>

                        </div>

                    </div>


                    <div class="card-actions">

                        <button
                            class="btn-print"
                            onclick="cetakStruk(${order.id})"
                        >
                            🖨️ Cetak Struk & Selesai
                        </button>

                    </div>

                </div>
            `;

        });

    }


    // ==========================================
    // CETAK STRUK
    // ==========================================

    async function cetakStruk(orderId) {

        const order =
            listPesanan.find(
                o =>
                    Number(o.id) ===
                    Number(orderId)
            );


        if (!order) return;


        let grandTotal = 0;
        let itemsHTML = "";


        order.items.forEach(item => {

            const subtotal =
                Number(item.price) *
                Number(item.qty);


            grandTotal += subtotal;


            itemsHTML += `
                <div class="receipt-item">

                    <span>
                        ${item.qty}x ${item.name}
                    </span>

                    <span>
                        ${subtotal.toLocaleString("id-ID")}
                    </span>

                </div>
            `;

        });


        const printArea =
            document.getElementById(
                "receipt-print-area"
            );


        printArea.innerHTML = `

            <div class="receipt-header">

                <h2>
                    OMAH KOPI & RASA
                </h2>

                <p>
                    ${order.meja}
                </p>

                <p>
                    Jam: ${order.jam}
                </p>

            </div>


            <div>
                ${itemsHTML}
            </div>


            <div class="receipt-total">

                <span>
                    TOTAL
                </span>

                <span>
                    Rp ${grandTotal.toLocaleString("id-ID")}
                </span>

            </div>


            <div class="receipt-footer">
                Terima Kasih Atas Kunjungannya!
            </div>

        `;


        window.print();


        // Hapus pesanan dari Supabase

        try {

            const response =
                await fetch(
                    `${SUPABASE_URL}/rest/v1/order?id=eq.${orderId}`,
                    {
                        method: "DELETE",

                        headers: {
                            "apikey": SUPABASE_KEY,
                            "Authorization":
                                `Bearer ${SUPABASE_KEY}`,
                            "Prefer":
                                "return=minimal"
                        }
                    }
                );


            if (!response.ok) {

                console.error(
                    "DELETE ERROR:",
                    await response.text()
                );

                alert(
                    "Struk sudah dicetak, tetapi pesanan gagal dihapus dari dapur."
                );

                return;

            }


            await loadOrders();


        } catch (error) {

            console.error(error);

        }

    }


    // ==========================================
    // HAPUS SEMUA PESANAN
    // ==========================================

    async function clearAllOrders() {

        if (!confirm(
            "Yakin ingin menghapus semua pesanan?"
        )) {
            return;
        }


        try {

            const response =
                await fetch(
                    `${SUPABASE_URL}/rest/v1/order?id=not.is.null`,
                    {
                        method: "DELETE",

                        headers: {
                            "apikey": SUPABASE_KEY,
                            "Authorization":
                                `Bearer ${SUPABASE_KEY}`,
                            "Prefer":
                                "return=minimal"
                        }
                    }
                );


            if (!response.ok) {

                console.error(
                    await response.text()
                );

                alert(
                    "Gagal menghapus semua pesanan."
                );

                return;

            }


            await loadOrders();


        } catch (error) {

            console.error(error);

            alert(
                "Tidak dapat terhubung ke database."
            );

        }

    }


    // ==========================================
    // REFRESH OTOMATIS
    // ==========================================

    loadOrders();

    setInterval(
        loadOrders,
        2000
    );

</script>

</body>
</html>
