```html
<!DOCTYPE html>
<html lang="id">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Layar Dapur & Kasir - Omah Kopi</title>

    <link rel="preconnect"
          href="https://fonts.googleapis.com">

    <link rel="preconnect"
          href="https://fonts.gstatic.com"
          crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&family=Playfair+Display:wght@600&display=swap"
          rel="stylesheet">


    <style>

        :root {

            --bg-color: #fcf8f3;
            --primary-color: #4a2c2a;
            --accent-color: #8c5a3c;
            --light-accent: #e8d8c8;
            --text-dark: #2d2424;

            --shadow:
                0 8px 20px rgba(74, 44, 42, 0.08);

        }


        * {

            margin: 0;
            padding: 0;
            box-sizing: border-box;

            font-family:
                'Poppins',
                sans-serif;

        }


        body {

            background-color:
                var(--bg-color);

            color:
                var(--text-dark);

            padding: 20px;

        }


        .header-dapur {

            background-color:
                var(--primary-color);

            color: #fff;

            padding: 20px;

            border-radius: 16px;

            display: flex;

            justify-content:
                space-between;

            align-items:
                center;

            margin-bottom: 25px;

            box-shadow:
                var(--shadow);

        }


        .header-dapur h1 {

            font-family:
                'Playfair Display',
                serif;

            font-size: 22px;

            color: #f3e5d8;

        }


        .header-dapur p {

            font-size: 12px;

            margin-top: 3px;

        }


        .clear-btn {

            background: #d9534f;

            color: #fff;

            border: none;

            padding: 8px 14px;

            border-radius: 8px;

            font-size: 12px;

            cursor: pointer;

            font-weight: 600;

        }


        .grid-antrean {

            display: grid;

            grid-template-columns:
                repeat(
                    auto-fill,
                    minmax(280px, 1fr)
                );

            gap: 20px;

        }


        .order-card {

            background: #fff;

            border-radius: 16px;

            border:
                2px solid
                var(--light-accent);

            box-shadow:
                var(--shadow);

            overflow: hidden;

        }


        .card-header {

            background:
                var(--primary-color);

            color: #fff;

            padding: 12px 16px;

            display: flex;

            justify-content:
                space-between;

            align-items:
                center;

        }


        .meja-title {

            font-size: 16px;

            font-weight: 600;

            color: #f3e5d8;

        }


        .jam {

            font-size: 11px;

            color:
                var(--light-accent);

        }


        .card-body {

            padding: 16px;

        }


        .item-row {

            display: flex;

            justify-content:
                space-between;

            align-items:
                center;

            font-size: 13px;

            margin-bottom: 8px;

            padding-bottom: 6px;

            border-bottom:
                1px dashed #eee;

        }


        .qty-badge {

            background:
                var(--primary-color);

            color: #fff;

            padding: 2px 7px;

            border-radius: 6px;

            font-weight: 700;

            font-size: 12px;

            margin-right: 6px;

        }


        .item-name {

            font-weight: 600;

            color:
                var(--primary-color);

        }


        .card-total {

            margin-top: 15px;

            padding-top: 10px;

            border-top:
                2px dashed
                var(--light-accent);

            display: flex;

            justify-content:
                space-between;

            font-weight: 600;

            color:
                var(--accent-color);

        }


        .card-actions {

            padding: 12px 16px;

            background: #fdfaf7;

            border-top:
                1px solid
                var(--light-accent);

        }


        .btn-print {

            width: 100%;

            background-color:
                var(--primary-color);

            color: #fff;

            border: none;

            padding: 10px;

            border-radius: 8px;

            font-size: 12px;

            font-weight: 600;

            cursor: pointer;

        }


        .loading {

            grid-column: 1 / -1;

            text-align: center;

            margin-top: 50px;

            color:
                var(--accent-color);

        }


        @media print {

            body * {

                visibility: hidden;

            }

            #receipt-print-area,
            #receipt-print-area * {

                visibility: visible;

            }

            #receipt-print-area {

                position: absolute;

                left: 0;

                top: 0;

                width: 80mm;

                font-family:
                    'Courier New',
                    monospace;

                padding: 10px;

                color: #000;

            }

            .receipt-header {

                text-align: center;

                border-bottom:
                    1px dashed #000;

                padding-bottom: 10px;

                margin-bottom: 10px;

            }

            .receipt-item {

                display: flex;

                justify-content:
                    space-between;

                font-size: 11px;

                margin-bottom: 4px;

            }

            .receipt-total {

                border-top:
                    1px dashed #000;

                margin-top: 10px;

                padding-top: 5px;

                display: flex;

                justify-content:
                    space-between;

                font-weight: bold;

            }

            .receipt-footer {

                text-align: center;

                margin-top: 15px;

                font-size: 10px;

                border-top:
                    1px dashed #000;

                padding-top: 5px;

            }

        }

    </style>

</head>


<body>


    <div class="header-dapur">

        <div>

            <h1>
                👨‍🍳 Layar Monitor Dapur & Kasir
            </h1>

            <p>
                Antrean Pesanan Masuk Real-Time
            </p>

        </div>


        <button class="clear-btn"
                onclick="clearAllOrders()">

            Reset Semua Pesanan

        </button>

    </div>


    <div class="grid-antrean"
         id="antrean-container">

        <div class="loading">
            Memuat pesanan...
        </div>

    </div>


    <div id="receipt-print-area"
         style="display: none;">
    </div>


    <script>


        // ================================
        // SUPABASE
        // ================================

        const SUPABASE_URL =
            "https://ebfzxtdumtllztgnijww.supabase.co";


        const SUPABASE_KEY =
            "sb_publishable_YVUp6Jqo66JTGVOMgD_r7w_9NAF4AZO";


        // ================================
        // DATA PESANAN
        // ================================

        let listPesanan = [];


        // ================================
        // AMBIL PESANAN DARI SUPABASE
        // ================================

        async function loadOrders() {

            try {

                const response = await fetch(
                    `${SUPABASE_URL}/rest/v1/order?select=*&order=created_at.asc`,
                    {

                        method: "GET",

                        headers: {

                            "apikey": SUPABASE_KEY,

                            "Authorization":
                                `Bearer ${SUPABASE_KEY}`

                        }

                    }
                );


                if (!response.ok) {

                    const errorText =
                        await response.text();

                    console.error(errorText);

                    throw new Error(
                        "Gagal mengambil pesanan"
                    );

                }


                listPesanan =
                    await response.json();

                renderAntrean();


            } catch (error) {

                console.error(error);

                document.getElementById(
                    'antrean-container'
                ).innerHTML = `

                    <h3 class="loading">
                        Gagal terhubung ke database.
                    </h3>

                `;

            }

        }


        // ================================
        // TAMPILKAN PESANAN
        // ================================

        function renderAntrean() {

            const container =
                document.getElementById(
                    'antrean-container'
                );


            container.innerHTML = '';


            if (listPesanan.length === 0) {

                container.innerHTML = `

                    <h3 style="
                        grid-column: 1/-1;
                        text-align: center;
                        color: var(--accent-color);
                        margin-top: 50px;
                    ">
                        Belum Ada Pesanan Masuk...
                    </h3>

                `;

                return;

            }


            listPesanan.forEach(order => {

                let itemsHTML = '';

                let grandTotal = 0;


                order.items.forEach(item => {

                    const subtotal =
                        item.price * item.qty;

                    grandTotal += subtotal;


                    itemsHTML += `

                        <div class="item-row">

                            <div>

                                <span class="qty-badge">
                                    ${item.qty}x
                                </span>

                                <span class="item-name">
                                    ${item.name}
                                </span>

                            </div>

                            <div>
                                Rp ${subtotal.toLocaleString('id-ID')}
                            </div>

                        </div>

                    `;

                });


                container.innerHTML += `

                    <div class="order-card">

                        <div class="card-header">

                            <span class="meja-title">
                                📍 ${order.meja}
                            </span>

                            <span class="jam">
                                ${order.jam}
                            </span>

                        </div>


                        <div class="card-body">

                            ${itemsHTML}


                            <div class="card-total">

                                <span>
                                    Total Tagihan:
                                </span>

                                <span>
                                    Rp ${grandTotal.toLocaleString('id-ID')}
                                </span>

                            </div>

                        </div>


                        <div class="card-actions">

                            <button class="btn-print"
                                    onclick="cetakStruk(${order.id})">

                                🖨️ Cetak Struk & Selesai

                            </button>

                        </div>

                    </div>

                `;

            });

        }


        // ================================
        // CETAK & HAPUS PESANAN
        // ================================

        async function cetakStruk(orderId) {

            const order =
                listPesanan.find(
                    o => o.id == orderId
                );


            if (!order) return;


            const printArea =
                document.getElementById(
                    'receipt-print-area'
                );


            let grandTotal = 0;

            let itemsText = '';


            order.items.forEach(item => {

                const subtotal =
                    item.price * item.qty;

                grandTotal += subtotal;


                itemsText += `

                    <div class="receipt-item">

                        <span>
                            ${item.qty}x ${item.name}
                        </span>

                        <span>
                            ${subtotal.toLocaleString('id-ID')}
                        </span>

                    </div>

                `;

            });


            printArea.innerHTML = `

                <div class="receipt-header">

                    <h2>
                        OMAH KOPI & RASA
                    </h2>

                    <p>
                        <b>${order.meja}</b>
                        | Jam: ${order.jam}
                    </p>

                    <p>
                        --------------------------------
                    </p>

                </div>


                <div>
                    ${itemsText}
                </div>


                <div class="receipt-total">

                    <span>
                        TOTAL:
                    </span>

                    <span>
                        Rp ${grandTotal.toLocaleString('id-ID')}
                    </span>

                </div>


                <div class="receipt-footer">

                    <p>
                        Terima Kasih Atas Kunjungannya!
                    </p>

                </div>

            `;


            printArea.style.display =
                'block';


            window.print();


            printArea.style.display =
                'none';


            // Hapus dari DATABASE

            try {

                const response =
                    await fetch(
                        `${SUPABASE_URL}/rest/v1/order?id=eq.${orderId}`,
                        {

                            method: "DELETE",

                            headers: {

                                "apikey":
                                    SUPABASE_KEY,

                                "Authorization":
                                    `Bearer ${SUPABASE_KEY}`

                            }

                        }
                    );


                if (!response.ok) {

                    console.error(
                        await response.text()
                    );

                    return;

                }


                await loadOrders();


            } catch (error) {

                console.error(error);

            }

        }


        // ================================
        // RESET SEMUA PESANAN
        // ================================

        async function clearAllOrders() {

            const yakin =
                confirm(
                    "Hapus semua pesanan?"
                );


            if (!yakin) return;


            try {

                const response =
                    await fetch(
                        `${SUPABASE_URL}/rest/v1/order?id=not.is.null`,
                        {

                            method: "DELETE",

                            headers: {

                                "apikey":
                                    SUPABASE_KEY,

                                "Authorization":
                                    `Bearer ${SUPABASE_KEY}`,

                                "Prefer":
                                    "return=minimal"

                            }

                        }
                    );


                if (!response.ok) {

                    console.error(
                        await response.text()
                    );

                    alert(
                        "Gagal menghapus pesanan."
                    );

                    return;

                }


                await loadOrders();


            } catch (error) {

                console.error(error);

                alert(
                    "Tidak bisa terhubung ke database."
                );

            }

        }


        // ================================
        // CEK PESANAN SETIAP 2 DETIK
        // ================================

        loadOrders();

        setInterval(
            loadOrders,
            2000
        );


    </script>

</body>

</html>
